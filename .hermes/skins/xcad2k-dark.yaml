name: xcad2k-dark
description: xcad2k charcoal with neutral UI accents
colors:
  background: '#171717'
  ui_text: '#D1D1D1'
  ui_accent: '#F1F1F1'
  ui_label: '#D1D1D1'
  ui_border: '#555555'
  ui_ok: '#93D6AE'
  ui_warn: '#F0CB7B'
  ui_error: '#FFA0AA'
  banner_border: '#555555'
  banner_title: '#F1F1F1'
  banner_accent: '#F1F1F1'
  banner_dim: '#A7A7A7'
  banner_text: '#D1D1D1'
  prompt: '#D1D1D1'
  input_rule: '#555555'
  response_border: '#555555'
  status_bar_bg: '#1D1D1D'
  status_bar_text: '#D1D1D1'
  status_bar_strong: '#F1F1F1'
  status_bar_dim: '#A7A7A7'
  status_bar_good: '#93D6AE'
  status_bar_warn: '#F0CB7B'
  status_bar_bad: '#FFA0AA'
  status_bar_critical: '#FFC1C8'
  session_label: '#D1D1D1'
  session_border: '#555555'
  completion_menu_bg: '#252525'
  completion_menu_current_bg: '#424242'
  selection_bg: '#424242'
customCSS: |
  :root[data-hermes-theme='xcad2k-dark'] {
    --ui-bg-chrome: #1D1D1D;
    --ui-bg-sidebar: #171717;
    --ui-bg-editor: #1D1D1D;
    --ui-bg-elevated: #252525;
    --ui-terminal-surface-background: #171717;
  }
  :root[data-hermes-theme='xcad2k-dark'] [data-slot='code-card'] {
    --ui-bg-editor: var(--ui-bg-elevated);
  }
