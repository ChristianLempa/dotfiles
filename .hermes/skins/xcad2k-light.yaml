name: xcad2k-light
description: xcad2k soft gray with neutral UI accents
colors:
  background: '#E6E6E6'
  ui_text: '#303030'
  ui_accent: '#333333'
  ui_label: '#303030'
  ui_border: '#858585'
  ui_ok: '#286343'
  ui_warn: '#755200'
  ui_error: '#A22748'
  banner_border: '#858585'
  banner_title: '#333333'
  banner_accent: '#333333'
  banner_dim: '#555555'
  banner_text: '#303030'
  prompt: '#303030'
  input_rule: '#858585'
  response_border: '#858585'
  status_bar_bg: '#EFEFEF'
  status_bar_text: '#303030'
  status_bar_strong: '#222222'
  status_bar_dim: '#555555'
  status_bar_good: '#286343'
  status_bar_warn: '#755200'
  status_bar_bad: '#A22748'
  status_bar_critical: '#922341'
  session_label: '#303030'
  session_border: '#858585'
  completion_menu_bg: '#EFEFEF'
  completion_menu_current_bg: '#D5D5D5'
  selection_bg: '#D5D5D5'
customCSS: |
  :root[data-hermes-theme='xcad2k-light'] {
    --ui-bg-chrome: #EFEFEF;
    --ui-bg-sidebar: #E6E6E6;
    --ui-bg-editor: #EFEFEF;
    --ui-bg-elevated: #FAFAFA;
    --ui-terminal-surface-background: #E6E6E6;
  }
  :root[data-hermes-theme='xcad2k-light'] [data-slot='code-card'] {
    --ui-bg-editor: var(--ui-bg-elevated);
  }
